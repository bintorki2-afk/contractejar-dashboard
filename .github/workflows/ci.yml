name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Vitest + Build
    runs-on: ubuntu-latest
    env:
      # اللوحة تعرض الأوقات بتوقيت الرياض والاختبارات تفترضه — سيرفر GitHub على UTC افتراضياً
      TZ: Asia/Riyadh

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Dependency audit (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
